name: Release

# Pushing a tag like v0.2.0 builds installers for every platform and attaches
# them to a draft GitHub release named after the tag, together with the signed
# updater bundles and the latest.json manifest the in-app updater reads.
# Publish the draft to ship; installed copies then offer the update.
#
# The browser extension is built first: the Firefox add-on is signed by
# Mozilla (self-distributed, so it never appears on addons.mozilla.org) and
# bundled into every installer. The release also carries updates.json, which
# the add-on's update_url reads through the latest-release link, so Firefox
# installs the new add-on from the release once the draft is published. The
# macOS build also wraps the extension as
# a Safari extension inside Gloss.app. The Chrome Web Store zip is attached
# to the release for a manual upload to the store.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-22.04
    outputs:
      xpi: ${{ steps.sign.outputs.xpi }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Set version from tag
        run: bash scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build the extension
        working-directory: extension
        run: |
          npm ci
          npm run build
          npm run zip

      - name: Sign the Firefox add-on with Mozilla (self-distributed)
        id: sign
        working-directory: extension
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "AMO secrets missing: the installers ship without the Firefox add-on"
            echo "xpi=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx web-ext sign --source-dir dist/firefox --artifacts-dir dist/signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp dist/signed/*.xpi dist/gloss.xpi
          echo "xpi=dist/gloss.xpi" >> "$GITHUB_OUTPUT"
          # Firefox's update manifest for the add-on, pointing at this tag's .xpi.
          version="$(node -p 'require("./dist/firefox/manifest.json").version')"
          hash="sha256:$(sha256sum dist/gloss.xpi | cut -d' ' -f1)"
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/gloss.xpi"
          node -e '
            const [version, link, hash] = process.argv.slice(1);
            const doc = { addons: { "gloss@aay.sh": { updates: [{ version, update_link: link, update_hash: hash }] } } };
            require("fs").writeFileSync("dist/updates.json", JSON.stringify(doc, null, 2) + "\n");
          ' "$version" "$link" "$hash"

      # A store rejection (for example a submission still under review, or a
      # revoked token) must not block the release: the installers and the
      # Firefox add-on do not depend on the store, and chrome.zip is attached
      # to the release for a manual upload either way.
      - name: Publish to the Chrome Web Store
        continue-on-error: true
        working-directory: extension
        env:
          # OAuth client for the Chrome Web Store API, see docs/extension.md.
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CWS_CLIENT_ID" ]; then
            echo "CWS secrets missing: chrome.zip is attached to the release for a manual upload"
            exit 0
          fi
          id="$(tr -d '[:space:]' < EXTENSION_ID)"
          npx chrome-webstore-upload-cli@3 upload --source dist/chrome.zip --extension-id "$id" \
            --client-id "$CWS_CLIENT_ID" --client-secret "$CWS_CLIENT_SECRET" --refresh-token "$CWS_REFRESH_TOKEN"
          npx chrome-webstore-upload-cli@3 publish --extension-id "$id" \
            --client-id "$CWS_CLIENT_ID" --client-secret "$CWS_CLIENT_SECRET" --refresh-token "$CWS_REFRESH_TOKEN"

      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            extension/dist/*.zip
            extension/dist/gloss.xpi
            extension/dist/updates.json
          if-no-files-found: ignore

  build:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: bash scripts/set-version.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: extension/dist

      - name: Bundle the Firefox add-on signed by the extension job
        shell: bash
        run: |
          mkdir -p ui/src-tauri/resources
          if [ -f extension/dist/gloss.xpi ]; then
            cp extension/dist/gloss.xpi ui/src-tauri/resources/gloss.xpi
            echo "${GITHUB_REF_NAME#v}" | sed 's/-.*//' > ui/src-tauri/resources/gloss.xpi.version
          else
            : > ui/src-tauri/resources/gloss.xpi
          fi

      - name: Import the signing certificate for Xcode (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            bash scripts/import-signing-cert.sh
          fi

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles with the key whose public half is in
          # tauri.conf.json; the app refuses an update without a valid signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization; the build is unsigned when unset.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing; unsigned when unset.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gloss ${{ github.ref_name }}'
          releaseBody: 'Installers for macOS (.dmg), Windows (.exe, .msi) and Linux (.AppImage, .deb, .rpm) are attached below.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          projectPath: ui
          # The Safari extension is built by Xcode in the bundle's prepare step
          # (scripts/prepare-bundle.sh) with APPLE_SIGNING_IDENTITY.
          args: --target ${{ matrix.target }}

  attach-extension:
    needs: [extension, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: dist

      - name: Attach the extension builds to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls dist
          gh release upload "$GITHUB_REF_NAME" dist/chrome.zip dist/firefox.zip --clobber
          [ -f dist/gloss.xpi ] && gh release upload "$GITHUB_REF_NAME" dist/gloss.xpi --clobber || true
          [ -f dist/updates.json ] && gh release upload "$GITHUB_REF_NAME" dist/updates.json --clobber || true

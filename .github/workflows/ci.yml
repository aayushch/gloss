name: CI

# Every push and pull request compiles the engine, the bridge host and the
# Tauri shell on all three platforms, runs the engine and frontend test
# suites, and builds and tests the browser extension.

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Frontend check, tests and build
        working-directory: ui
        run: |
          npm run check
          npm test
          npm run build

      # The shell's build script refuses to compile without the sidecar
      # binary and the bundled add-on slot it is configured to ship.
      - name: Build the bridge sidecar
        shell: bash
        run: |
          bash scripts/build-bridge.sh --debug
          mkdir -p ui/src-tauri/resources
          [ -f ui/src-tauri/resources/gloss.xpi ] || : > ui/src-tauri/resources/gloss.xpi

      - name: Engine, bridge and shell tests
        run: cargo test -p gloss-engine -p gloss-bridge -p gloss-app

      - name: Clippy (engine and shell)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the app binary
        working-directory: ui
        run: npx tauri build --debug --no-bundle

  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Extension check, tests and build
        working-directory: extension
        run: |
          npm run check
          npm test
          npm run build
          npm run lint:firefox

      - name: Package the builds
        working-directory: extension
        run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            extension/dist/*.zip

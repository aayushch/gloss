name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections
        below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Gloss is affected?
      options:
        - Chat UI (conversations, clarifications, artifacts)
        - Agent driving (a CLI misbehaves inside Gloss)
        - Browser extension (Chrome-family / Firefox)
        - Safari extension
        - Installer, updater or packaging
        - Other
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which agent CLI were you using, if any?
      options:
        - Claude Code
        - Codex CLI
        - Gemini CLI
        - Pi
        - Cursor Agent
        - Not agent-specific

  - type: input
    id: version
    attributes:
      label: Gloss Version
      description: Version from the installer name or the app's Settings
      placeholder: e.g. 2.1.9

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste the relevant part of `~/.gloss/logs/gloss.log` or attach screenshots.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information that might help.

[package]
name = "gloss-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gloss: inline clarifications for CLI-agent conversations"

[lib]
name = "gloss_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gloss-engine = { path = "../../engine" }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Title-bar dragging on macOS calls AppKit directly; see `start_drag` in lib.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSWindow"] }

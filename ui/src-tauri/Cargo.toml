[package]
name = "gloss-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gloss: inline clarifications for CLI-agent conversations"

[lib]
name = "gloss_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gloss-engine = { path = "../../engine" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
dirs.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
